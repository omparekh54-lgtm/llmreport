# Publishes to PyPI whenever you create a GitHub Release.
# Uses PyPI "Trusted Publishing", so no API token is stored anywhere.
# One-time setup: on pypi.org -> Your account -> Publishing -> add a pending publisher
# with this repo's owner, repo name, workflow "publish.yml" and environment "pypi".

name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
