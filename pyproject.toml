[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmreport"
version = "0.3.0"
description = "Reports, quick functions and live training tracking for any PyTorch language model: architecture, health, speed, perplexity, behavior, code, and a live training dashboard with alerts."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "omparekh54-lgtm" }]
keywords = ["llm", "evaluation", "transformers", "pytorch", "model-card", "profiling", "nlp", "training", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "psutil>=5.9",
]

[project.optional-dependencies]
rich = ["rich>=13"]
tokenizers = ["sentencepiece", "tiktoken"]
dev = ["pytest>=7", "ruff>=0.4", "build", "twine", "sentencepiece", "tiktoken", "accelerate"]

[project.scripts]
llmreport = "llmreport.cli:main"

[project.urls]
Homepage = "https://github.com/omparekh54-lgtm/llmreport"
Issues = "https://github.com/omparekh54-lgtm/llmreport/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmreport = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take a while (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set so new ruff releases can't change what CI checks.
# E4/E7/E9 = real errors, F = pyflakes (unused imports, undefined names), I = import order.
select = ["E4", "E7", "E9", "F", "I"]
